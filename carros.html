<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cliente Web - Veículos Completo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .action-btn { margin-right: 5px; margin-bottom: 5px; }
        pre { background: #f8f9fa; padding: 10px; border: 1px solid #ddd; max-height: 300px; overflow-y: auto;}
    </style>
</head>
<body class="bg-light">

<div id="app" class="container py-5">
    <h1 class="mb-4 text-center">Gestão de Veículos (Web Client)</h1>

    <div class="row">
        <div class="col-md-4">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">1. Buscar e Adicionar (FIPE)</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label>Marca:</label>
                        <select class="form-select" v-model="selectedMarca" @change="buscarModelos">
                            <option value="">Selecione...</option>
                            <option v-for="m in marcas" :value="m.codigo">{{ m.nome }}</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Modelo:</label>
                        <select class="form-select" v-model="selectedModelo" @change="buscarAnos" :disabled="!selectedMarca">
                            <option value="">Selecione...</option>
                            <option v-for="m in modelos" :value="m.codigo">{{ m.nome }}</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Ano:</label>
                        <select class="form-select" v-model="selectedAno" :disabled="!selectedModelo">
                            <option value="">Selecione o ano...</option>
                            <option v-for="a in anos" :value="a.codigo">{{ a.nome }}</option>
                        </select>
                    </div>
                    <button class="btn btn-success w-100" @click="salvarVeiculo" :disabled="!selectedAno">
                        💾 Salvar no Servidor
                    </button>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <span>2. Veículos Salvos (Local DB)</span>
                    <button class="btn btn-sm btn-outline-light" @click="carregarLocal">🔄 Atualizar</button>
                </div>
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush">
                        <li v-for="v in veiculosLocais" :key="v.id_local" class="list-group-item">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h5 class="mb-1">#{{ v.id_local }} - {{ v.Modelo }}</h5>
                                    <span class="badge bg-secondary">{{ v.AnoModelo }}</span>
                                    <span class="badge bg-info text-dark ms-1">{{ v.Valor }}</span>
                                </div>
                                <div class="text-center">
                                    <h3 class="mb-0">{{ v.votos }}</h3>
                                    <small>votos</small>
                                </div>
                            </div>
                            <div class="mt-3 pt-2 border-top d-flex flex-wrap justify-content-end">
                                <button class="btn btn-sm btn-outline-success action-btn" @click="votar(v.id_local)">👍 Like</button>
                                <button class="btn btn-sm btn-outline-primary action-btn" @click="abrirModalEdicao(v)">✏️ Editar</button>
                                <button class="btn btn-sm btn-outline-info action-btn" @click="verXml(v.id_local)">📄 XML</button>
                                <button class="btn btn-sm btn-outline-secondary action-btn" @click="verJson(v.id_local)">🧾 JSON</button>
                                <button class="btn btn-sm btn-outline-dark action-btn" @click="verProto(v.id_local)">📦 Proto</button>

                                <button class="btn btn-sm btn-outline-danger action-btn" @click="deletar(v.id_local)">🗑️</button>
                            </div>
                        </li>
                        <li v-if="veiculosLocais.length === 0" class="list-group-item text-center text-muted py-4">
                            Nenhum veículo salvo.
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalEdicao" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Veículo #{{ editData.id }}</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label>Modelo:</label>
                        <input type="text" class="form-control" v-model="editData.modelo">
                    </div>
                    <div class="mb-3">
                        <label>Ano:</label>
                        <input type="text" class="form-control" v-model="editData.ano">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" @click="salvarEdicao">Salvar Alterações</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalXml" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Dados</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <pre>{{ xmlContent }}</pre>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    const { createApp } = Vue;
    const API_URL = 'http://127.0.0.1:5000';

    createApp({
        data() {
            return {
                marcas: [], modelos: [], anos: [], veiculosLocais: [],
                selectedMarca: '', selectedModelo: '', selectedAno: '',
                
                // Dados reativos para o formulário de edição
                editData: { id: null, modelo: '', ano: '' },
                
                // Instâncias do Bootstrap Modal
                bsModalEdicao: null, bsModalXml: null,
                xmlContent: ''
            }
        },
        methods: {
            async buscarMarcas() {
                const res = await fetch(`${API_URL}/externo`);
                this.marcas = await res.json();
            },
            async buscarModelos() {
                this.modelos = []; this.anos = [];
                const res = await fetch(`${API_URL}/externo/${this.selectedMarca}`);
                const data = await res.json();
                this.modelos = data.modelos;
            },
            async buscarAnos() {
                this.anos = [];
                const res = await fetch(`${API_URL}/externo/${this.selectedMarca}/${this.selectedModelo}`);
                this.anos = await res.json();
            },
            async salvarVeiculo() {
                if(!this.selectedAno) return;
                await fetch(`${API_URL}/externo/${this.selectedMarca}/${this.selectedModelo}/${this.selectedAno}`);
                this.carregarLocal();
                this.selectedModelo = ''; this.selectedAno = '';
                alert('Salvo!');
            },
            async carregarLocal() {
                const res = await fetch(`${API_URL}/veiculos/ranking`);
                this.veiculosLocais = await res.json();
            },
            
            // --- AÇÕES ---
            async votar(id) {
                await fetch(`${API_URL}/veiculos/${id}/votar`, { method: 'POST' });
                this.carregarLocal();
            },
            async deslike(id) {
                await fetch(`${API_URL}/veiculos/${id}/deslike`, { method: 'POST' });
                this.carregarLocal();
            },
            async deletar(id) {
                if(confirm('Remover?')) {
                    await fetch(`${API_URL}/veiculos/${id}`, { method: 'DELETE' });
                    this.carregarLocal();
                }
            },
            
            // --- XML ---
            async verXml(id) {
                this.xmlContent = 'Carregando...';
                this.bsModalXml.show();
                const res = await fetch(`${API_URL}/veiculos/${id}`, {
                    headers: { 'Accept': 'application/xml' }
                });
                this.xmlContent = await res.text();
            },

            // --- JSON ---
            async verJson(id) {
                this.xmlContent = 'Carregando...';
                this.bsModalXml.show();
                const res = await fetch(`${API_URL}/veiculos/${id}`, {
                    headers: { 'Accept': 'application/json' }
                });
                const data = await res.json();
                this.xmlContent = JSON.stringify(data, null, 2); // bonito formatado
            },

            // --- PROTO BUFFER ---
            async verProto(id) {
                this.xmlContent = 'Carregando...';
                this.bsModalXml.show();
                const res = await fetch(`${API_URL}/veiculos/${id}`, {
                    headers: { 'Accept': 'application/x-protobuf' }
                });

                const buffer = await res.arrayBuffer();
                const bytes = new Uint8Array(buffer);

                // Exibe em formato hexadecimal
                this.xmlContent = Array.from(bytes)
                    .map(b => b.toString(16).padStart(2, '0'))
                    .join(' ');
            },

            // --- EDIÇÃO (CORRIGIDA) ---
            abrirModalEdicao(v) {
                // Copia os dados do objeto da lista para o objeto de edição
                this.editData.id = v.id_local;
                this.editData.modelo = v.Modelo;     // Atenção às maiúsculas retornadas pelo GET
                this.editData.ano = v.AnoModelo;     // Campo exato retornado pelo servidor
                
                this.bsModalEdicao.show();
            },

            async salvarEdicao() {
                const id = this.editData.id;

                // 🔥 CAMPOS EXATOS que o backend realmente usa
                const payload = {
                    Modelo: this.editData.modelo,
                    AnoModelo: this.editData.ano
                };

                try {
                    const res = await fetch(`${API_URL}/veiculos/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!res.ok) {
                        const erro = await res.text();
                        alert('Erro ao atualizar: ' + erro);
                        return;
                    }

                    this.bsModalEdicao.hide();
                    this.carregarLocal();

                } catch (error) {
                    alert('Erro de conexão: ' + error);
                }
            }
        },
        mounted() {
            this.buscarMarcas();
            this.carregarLocal();
            // Inicializa os modais do Bootstrap
            this.bsModalEdicao = new bootstrap.Modal(document.getElementById('modalEdicao'));
            this.bsModalXml = new bootstrap.Modal(document.getElementById('modalXml'));
        }
    }).mount('#app');
</script>
</body>
</html>
